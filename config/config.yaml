# Coverage gap analysis — run configuration.
# Everything a run needs that is not a project fact (those live in profiles/<name>/).
# CLI flags override: --profile, --module, --env, --skip, --from, --until.

defaultProfile: avl
defaultModule: grid export

# ---------------------------------------------------------------- environment
# Which environment the UI explorer opens. --env <name> overrides.
environment: test
environments:
  test:
    uiBaseUrl: https://generic-avl-stable.ridango.cloud/
    browser: msedge                               # chrome | msedge | firefox | webkit (installed browser channel)
    login:
      # storage-state: `npm run ui-login -- --env test` logs in once and saves the session to the file below
      #                (git-ignored under cache/). Agents get only the session, never the password.
      # none:          the app needs no login.
      method: storage-state
      storageState: cache/avl/ui/test.storage.json
      # Where ui-login reads the username and password (git-ignored .env; never printed or passed to agents).
      # Without it, ui-login opens a browser and you log in by hand.
      credentials:
        envFile: .env
        userVar: TEST_USERNAME
        passwordVar: TEST_PASSWORD
      # The login form, by accessible name (as in the Playwright project's LoginPage).
      form:
        username: Username
        password: Password
        submit: Log in
    # full UI mode (the app may save, submit or delete) is refused unless this is true.
    allowWrites: false

# ---------------------------------------------------------------- scope
scope:
  # Jira status categories to analyse. [] = all stories. Typical: [Done].
  statusCategories: []
  # Baseline: none = analyse every story in scope;
  #           last-run = only stories updated since the previous finished run of the same scope.
  baseline: none

# ---------------------------------------------------------------- pipeline
# Phases run in order; the agents inside one phase run in parallel.
# Remove an agent to switch that part off (e.g. drop ui-explorer to skip UI exploration).
# module-scout, requirements-analyst and context-builder are required.
pipeline:
  - phase: scope
    agents: [module-scout]
  - phase: explore
    agents: [requirements-analyst, code-analyst, ui-explorer, zephyr-explorer]
  - phase: context
    agents: [context-builder]
  - phase: design
    agents: [test-designer]
  - phase: validate
    agents: [coverage-validator]
  - phase: report
    agents: [reporter]

agents:
  model:
    default: sonnet
    reporter: haiku
  timeoutMs: 1800000
  # An explorer that fails (e.g. the UI environment is down) is reported and the run goes on without it.
  # Set to false to stop the run instead.
  continueWhenExplorerFails: true
  ui-explorer:
    # observe:   navigate and read pages only (no clicks, no typing)
    # read-only: click, type and open dialogs; the browser blocks every POST/PUT/PATCH/DELETE the app sends
    # full:      no write block — only on an environment with allowWrites: true
    mode: read-only
    # Requests the read-only block lets through (regex on the URL), e.g. grid searches sent as POST.
    # AVL loads the logged-in user (tms-webapp/init), filter options (filter-provider) and grid rows
    # (<module>/filter, e.g. user/filter, performance/filter-assets) with POST; blocking them leaves the app on
    # "Loading" or the grids empty. Export jobs (exportjob/export/<n>) create data and stay blocked.
    allowedWriteUrls:
      - "/rest/tms-webapp/init$"
      - "/rest/filter-provider$"
      - "/rest/[a-z-]+(/[a-z-]+)*/filter(-[a-z-]+)?$"
    maxPages: 8
    headless: true
    playwrightMcp: "@playwright/mcp@0.0.83"
  coverage-validator:
    # Rejected drafts go back to the test-designer this many times before the report.
    maxRounds: 1

# ---------------------------------------------------------------- pipeline stages (scripts + Claude calls)
claude:
  bin: auto
  timeoutMs: 900000
  retries: 1
  maxTokensPerRun: 3000000

models:
  triage: claude-haiku-5-5
  extract-ac: claude-sonnet-5-5
  extract-code: claude-sonnet-5-5
  match: claude-opus-5-5
  design: claude-opus-5-5     # the module's full test suite, from the context-builder's module context
  check: claude-opus-5-5      # each designed case vs the existing Zephyr cases
  draft: claude-sonnet-5-5
  gap-review: claude-sonnet-5-5   # severity + requirement-gap wording for the gaps workbook

concurrency: 3

batch:
  triage: 40
  extract-ac: 6
  draft: 12
  gap-review: 40

limits:
  descriptionCharsTriage: 1200
  descriptionCharsExtract: 8000
  codeBytesPerModule: 300000
  candidateCasesPerStory: 40
  keywordCandidates: 12
  moduleCandidates: 15
  folderCandidates: 15
  designContextChars: 40000   # module context sent to the design call
  moduleContextChars: 20000   # module context sent with every draft batch

matching:
  autoAcceptConfidence: [High]

code:
  enabled: true
  skipForUcDocStories: false
  discovery:
    maxDepth: 3
    maxSpread: 8
    maxHits: 3
    maxCallers: 150
    variantSamples: 3
    extraTokens: []
    keywordSweep:
      enabled: true
      maxSeedsPerPhrase: 25
      maxMentions: 60

zephyr:
  exportMaxAgeHours: 12
  stepsMaxAgeHours: 168

validation:
  # A draft whose name shares this share of words with an existing case is flagged as a possible duplicate.
  duplicateNameOverlap: 0.8

# ---------------------------------------------------------------- output
# What the run produces. Checked when a run starts, so a typo fails before any tokens are spent.
output:
  # Second workbook gaps_<profile>_<scope>.xlsx next to the full one: Gaps + Supporting Evidence only.
  gapsWorkbook: true

  # Extra fields Claude fills in on top of the built-in ones. Each one is added to its stage's schema and
  # prompt (only that stage's cache is invalidated), and shown as its own column in the stage's sheet and in
  # coverage.json.
  #   name:        camelCase, e.g. riskLevel (must not clash with a built-in field)
  #   stages:      extract-ac / extract-code → 4_Expected_Scenarios, match → 7_Matching,
  #                design → 8_Test_Design, draft → 9_Gaps
  #   description: what Claude is told to put in it
  #   values:      optional, the allowed values; list: true for a list instead of one value
  #   header:      optional column header (default: the name)
  fields: []
  #  - name: riskLevel
  #    stages: [draft, design]
  #    description: Business risk if this behaviour breaks in production, judged from the story and module context.
  #    values: [Low, Medium, High]
  #    header: Risk
  #  - name: testData
  #    stages: [extract-ac, extract-code]
  #    description: Concrete data a tester needs to run this scenario (records, files, user roles), or "none".

  workbook:
    # Per sheet (by sheet name, e.g. 7_Matching, or without the number, e.g. Matching):
    #   false              leave the sheet out (9_Gaps cannot be left out)
    #   columns: [...]     only these columns, in this order (by header text)
    #   hide: [...]        every column except these
    #   rename: {old: new} change header text
    # IDs and reasoning columns cannot be removed (each decision row must say why). In 9_Gaps, the
    # columns create-approved reads cannot be removed or renamed. Extra fields are columns like any other.
    sheets: {}
    #  13_Run_Log: false
    #  14_Token_Usage: false
    #  7_Matching:
    #    columns: [Expected ID, Story, Scenario, Verdict, Confidence, Matched case(s), Match reasoning]
    #    rename: { Match reasoning: Why }
    #  4_Expected_Scenarios:
    #    hide: [Priority hint, Module]
